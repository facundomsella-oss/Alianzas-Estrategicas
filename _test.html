<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="o">x</pre><script src="assets/js/config.js"></script><script src="assets/js/contenido-rover.js"></script><script src="assets/js/contenido-educador.js"></script><script src="assets/js/contenido-distrito.js"></script><script src="assets/js/contenido.js"></script><script src="assets/js/motor.js"></script><script>var l=[];window.CONTENIDO.recursos.forEach(function(r){var p=Motor.crearPartida(r);Motor.siguienteEscenario(p);var n=0;while(!p.terminado){var e=p.escenarioActual;if(!e)break;var h=Motor.opcionesDisponibles(p,e).filter(function(o){return o.habilitada;});if(!h.length)break;Motor.elegirOpcion(p,h[Math.floor(Math.random()*h.length)].opcion);n++;}var f=Motor.resultadoFinal(p);l.push(r.nombre+": "+n+" turnos | "+f.porcentaje+"% | "+f.rango);});document.getElementById("o").textContent=l.join("\n");</script></body></html>
